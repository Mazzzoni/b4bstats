# Base file, safe anywhere (port on 127.0.0.1). The server adds compose.prod.yaml through its .env
# (COMPOSE_FILE, see .env.prod.dist). The site's settings are in .env.local (template .env.local.prod.dist).
services:
  web:
    build:
      context: .
      target: runtime
      secrets:
        - env_local
    ports:
      - "127.0.0.1:${WEB_PORT:-8487}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

secrets:
  env_local:
    file: .env.local
